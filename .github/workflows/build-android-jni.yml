name: "Build Android AAR"
on:
  push:
    branches:
      - fix-vision-v2
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: "Build complete AAR for Android ARM64"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install Android NDK r28b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -d /usr/local/lib/android/sdk/ndk/
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/android-ndk-r28b" >> $GITHUB_ENV

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build JNI .so
        run: |
          bazel build --config=android_arm64 \
            //kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni

      - name: Build Kotlin Android library
        run: |
          bazel build --config=android_arm64 \
            //kotlin/java/com/google/ai/edge/litertlm:litertlm-android

      - name: Package AAR
        run: |
          mkdir -p aar_build/jni/arm64-v8a
          
          # Copy JNI .so
          cp bazel-bin/kotlin/java/com/google/ai/edge/litertlm/jni/liblitertlm_jni.so aar_build/jni/arm64-v8a/
          
          # Copy prebuilt .so files
          cp prebuilt/android_arm64/libGemmaModelConstraintProvider.so aar_build/jni/arm64-v8a/
          cp prebuilt/android_arm64/libLiteRtGpuAccelerator.so aar_build/jni/arm64-v8a/
          cp prebuilt/android_arm64/libLiteRtOpenClAccelerator.so aar_build/jni/arm64-v8a/
          cp prebuilt/android_arm64/libLiteRtTopKOpenClSampler.so aar_build/jni/arm64-v8a/
          
          # Copy Kotlin classes
          cp bazel-bin/kotlin/java/com/google/ai/edge/litertlm/litertlm-android.jar aar_build/classes.jar
          
          # Create AndroidManifest.xml
          cat > aar_build/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.google.ai.edge.litertlm">
          </manifest>
          EOF
          
          # Create R.txt (empty)
          touch aar_build/R.txt
          
          # Package as AAR
          cd aar_build && zip -r ../litertlm-android-0.10.0-vision-fix.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: litertlm-android-aar
          path: litertlm-android-0.10.0-vision-fix.aar
