name: "Build Android AAR"
on:
  push:
    branches:
      - fix-vision-v2
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: "Build complete AAR for Android ARM64"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install Android NDK r28b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -d /usr/local/lib/android/sdk/ndk/
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/android-ndk-r28b" >> $GITHUB_ENV

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build JVM library
        run: |
          bazel build --config=android_arm64 \
            //kotlin/java/com/google/ai/edge/litertlm:litertlm-jvm

      - name: Package AAR
        run: |
          mkdir -p aar_build/jni/arm64-v8a
          
          # Kotlin classes (112KB - same as Maven original)
          cp bazel-bin/kotlin/java/com/google/ai/edge/litertlm/litertlm-jvm-kt.jar aar_build/classes.jar
          
          # Extract JNI .so from resources jar (53MB)
          cd aar_build
          jar xf ../bazel-bin/kotlin/java/com/google/ai/edge/litertlm/litertlm-jvm-resources.jar
          find . -name "liblitertlm_jni.so" -exec cp {} jni/arm64-v8a/ \;
          
          # Copy prebuilt shared libs
          cp ../prebuilt/android_arm64/libGemmaModelConstraintProvider.so jni/arm64-v8a/
          cp ../prebuilt/android_arm64/libLiteRtGpuAccelerator.so jni/arm64-v8a/
          cp ../prebuilt/android_arm64/libLiteRtOpenClAccelerator.so jni/arm64-v8a/
          cp ../prebuilt/android_arm64/libLiteRtTopKOpenClSampler.so jni/arm64-v8a/
          
          # Clean up extracted dirs (keep only AAR structure)
          rm -rf com kotlin
          
          echo '<?xml version="1.0" encoding="utf-8"?>' > AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.google.ai.edge.litertlm"/>' >> AndroidManifest.xml
          touch R.txt
          
          echo "=== AAR contents ==="
          ls -lh classes.jar jni/arm64-v8a/
          
          zip -r ../litertlm-android-0.10.0-vision-fix.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: litertlm-android-aar
          path: litertlm-android-0.10.0-vision-fix.aar
